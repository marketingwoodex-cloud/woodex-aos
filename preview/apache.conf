<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    AuthType Basic
    AuthName "Woodex local preview"
    AuthUserFile /run/woodex-auth/users
    Require valid-user
    <FilesMatch "(^\.|\.(sql|log|ini)$|^AGENTS\.md$)">
        Require all denied
    </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/html/(sessions|database)(/|$)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^/var/www/html/.*/uploads(/|$)">
    <FilesMatch "\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
